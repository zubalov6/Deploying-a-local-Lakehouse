name: lakehouse-q3

services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: lakekeeper_local_password
      POSTGRES_DB: lakekeeper
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper -d lakekeeper"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minio_local_password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.9.5
    command: ["migrate"]
    environment:
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:lakekeeper_local_password@postgres:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:lakekeeper_local_password@postgres:5432/lakekeeper
      LAKEKEEPER__PG_ENCRYPTION_KEY: local-demo-key-keep-for-this-project
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 512m

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.9.5
    command: ["serve"]
    environment:
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:lakekeeper_local_password@postgres:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:lakekeeper_local_password@postgres:5432/lakekeeper
      LAKEKEEPER__PG_ENCRYPTION_KEY: local-demo-key-keep-for-this-project
      LAKEKEEPER__AUTHZ_BACKEND: allowall
      RUST_LOG: info
    ports:
      - "127.0.0.1:8181:8181"
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  trino:
    image: trinodb/trino:476
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/catalog:/etc/trino/catalog:ro
    depends_on:
      lakekeeper:
        condition: service_healthy
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/status"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

volumes:
  postgres_data:
  minio_data:
